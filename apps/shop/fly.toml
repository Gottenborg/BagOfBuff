# Fly.io config for the Bag of Buff storefront (TanStack Start, SSR).
# Deploy from the repo root:
#   fly deploy --config apps/shop/fly.toml --dockerfile apps/shop/Dockerfile
#
# The API URL is baked in at build time via VITE_API_URL (see the Dockerfile);
# override it there for a staging deploy.
app = "bagofbuff-shop"
primary_region = "ams" # Amsterdam — EU

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
