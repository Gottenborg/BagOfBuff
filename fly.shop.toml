# Fly config for the storefront. Deploy with:
#   fly deploy --config fly.shop.toml --build-arg VITE_API_URL=… [--build-arg VITE_PLAUSIBLE_DOMAIN=…]
# NOTE: `app` must match the Fly app you created (`fly apps create bagofbuff-shop`).
app = "bagofbuff-shop"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.shop"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero when idle to minimise cost; first visitor after idle gets a
  # ~1-2s cold start. Bump to 1 later if you want the storefront always warm.
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
